[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; --- Entrada interactiva por el monitor serial ---
; send_on_enter: acumula lo que escribes y lo envía al pulsar ENTER
; monitor_echo:  muestra en pantalla lo que tecleas (por defecto no se ve)
; monitor_eol:   agrega '\n' al final (lo que espera readStringUntil('\n'))
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
; No external lib_deps — only Arduino.h, Wire.h, esp_timer.h (all built-in)
